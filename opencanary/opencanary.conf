{
    "device.node_id": "railway-honeypot-01",
    "ftp.enabled": true,
    "ftp.port": 8021,
    "ftp.banner": "FileZilla Server 0.9.41 beta",
    
    "http.enabled": true,
    "http.port": 8080,
    "http.banner": "Apache/2.4.41 (Ubuntu)",
    
    "ssh.enabled": true,
    "ssh.port": 8022,
    "ssh.version": "SSH-2.0-OpenSSH_8.2p1 Ubuntu-4ubuntu0.5",

    "logger": {
        "class": "PyLogger",
        "arguments": {
            "handlers": {
                "Console": {
                    "class": "logging.StreamHandler",
                    "stream": "ext://sys.stdout"
                }
            }
        }
    }
}
